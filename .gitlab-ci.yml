---

variables:
  DEBIAN_FRONTEND: noninteractive
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# Runs on GitLab's shared (instance) Linux runners, using Docker-in-Docker.
molecule:
  image: python:3.13
  services:
    - docker:dind
  script:
    - apt-get update -qq
    - apt-get -y -qq install docker-cli
    - python -m pip install --upgrade pip
    - pip3 install ansible molecule molecule-plugins[docker] docker
    - pip3 install --upgrade "ansible-core>=2.22"
    - cd $CI_PROJECT_DIR
    - molecule test
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"
  parallel:
    matrix:
      - image: "alpine"
        tag: "latest"
      - image: "enterpriselinux"
        tag: "latest"
      - image: "debian"
        tag: "latest"
      - image: "debian"
        tag: "bookworm"
      - image: "fedora"
        tag: "latest"
      - image: "ubuntu"
        tag: "latest"
      - image: "ubuntu"
        tag: "jammy"

galaxy:
  image: python:3.13
  script:
    - apt-get update -qq
    - apt-get -y -qq install ansible-core
    - ansible-galaxy role import --api-key ${GALAXY_API_KEY} robertdebock ${CI_PROJECT_NAME}
  rules:
    - if: $CI_COMMIT_TAG != null
